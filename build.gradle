plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Root development runs stage the UI subproject's JAR. Its tasks must be
// configured before resolving the archive provider (ModDevGradle multiproject).
evaluationDependsOn(':pyro-ui')

// No separate mod: dev and release share identity, only main is published.
sourceSets {
    development {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    developmentImplementation.extendsFrom implementation
    developmentRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('developmentJar', Jar) {
    group = 'build'
    description = 'Engine with development tools, not published.'
    archiveClassifier = 'development'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named('developmentClasses')
    from sourceSets.main.output
    from sourceSets.development.output
    from(tasks.named('jarJar'))
}
// Preserve the supported NeoForge Jar-in-Jar metadata and embedded library.
// Merely declaring jarJar(project(...)) does not include generated output in
// the ordinary Jar task for this ModDevGradle configuration.
tasks.named('jar', Jar) {
    from(tasks.named('jarJar'))
}
tasks.register('verifyReleaseJar') {
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.files(tasks.named('jar').flatMap { it.archiveFile })
    doLast { task ->
        def jarFile = task.inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def names = zip.entries().collect { it.name }
            def forbidden = names.findAll { name ->
                !name.endsWith('/') && (name.startsWith('net/kofllee/pyrovfx/client/dev/') ||
                name.startsWith('net/kofllee/pyrovfx/dev/') ||
                name.startsWith('net/kofllee/pyrovfx/museum/') ||
                name.contains('GameTests.class') ||
                name.startsWith('net/kofllee/pyrovfx/mixin/Bench') ||
                name.startsWith('assets/pyro_vfx/vfx/bench/') ||
                name.startsWith('assets/pyro_vfx/vfx/museum/') ||
                name.startsWith('assets/pyro_vfx/vfx/examples/') ||
                name.startsWith('assets/pyro_vfx/models/bench/') ||
                name == 'pyro_vfx_museum_exhibits.tsv' ||
                name == 'pyro_vfx.mixins.json' ||
                name.startsWith('data/pyro_vfx/structure/'))
            }
            if (!forbidden.isEmpty()) throw new GradleException(
                "Development files leaked into release jar:\n" + forbidden.join('\n'))
            if (!names.contains('META-INF/jarjar/metadata.json') ||
                !names.any { it.startsWith('META-INF/jarjar/') && it.endsWith('.jar') && it.contains('pyro-ui') }) {
                throw new GradleException('Release jar is missing bundled Pyro UI Jar-in-Jar metadata or binary')
            }
            if (names.any { it.startsWith('net/kofllee/pyroui/') }) {
                throw new GradleException('Pyro UI library classes were flattened instead of Jar-in-Jar packaged')
            }
            def nestedPath = names.find { it.startsWith('META-INF/jarjar/') &&
                    it.endsWith('.jar') && it.contains('pyro-ui') }
            def nestedNames = []
            new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry(nestedPath))).withCloseable { nested ->
                def entry
                while ((entry = nested.nextEntry) != null) nestedNames.add(entry.name)
            }
            def requiredUiFiles = [
                'META-INF/neoforge.mods.toml',
                'net/kofllee/pyroui/PyroUi.class',
                'net/kofllee/pyroui/PyroScreen.class',
                'net/kofllee/pyroui/MinecraftUiRenderer.class',
                'net/kofllee/pyroui/PyroUiTypographyGalleryScreen.class',
                'net/kofllee/pyroui/UiIconBounds.class',
                'assets/pyro_ui/textures/gui/icons/pixelarticons.png',
                'META-INF/licenses/pixelarticons-MIT.txt'
            ]
            if (!nestedNames.containsAll(requiredUiFiles)) {
                throw new GradleException('Standalone Pyro UI JAR is missing files: ' +
                    (requiredUiFiles - nestedNames))
            }
            if (names.contains('net/kofllee/pyrovfx/client/ui/MinecraftUiCanvas.class')) {
                throw new GradleException('Obsolete Pyro VFX Minecraft UI renderer still packaged')
            }
            if (names.any { it.startsWith('assets/pyro_vfx/font/pyro_icons') }) {
                throw new GradleException('Old Pyro VFX icon FontSet still packaged')
            }
            if (nestedNames.any { it.startsWith('net/kofllee/pyroui/font/')
                    || it.startsWith('assets/pyro_ui/font/')
                    || it.startsWith('assets/pyro_ui/font_atlas/')
                    || it.startsWith('assets/pyro_ui/shaders/core/ui_sdf')
                    || it.startsWith('assets/pyro_ui/shaders/core/ui_raster')
                    || it.startsWith('assets/pyro_ui/textures/font/')
                    || it.contains('lucide_hd') || it.contains('pixelarticons_hd') }) {
                throw new GradleException('Removed custom fonts or third-party icon styles leaked into Pyro UI')
            }
            task.logger.lifecycle('Verified release jar {} ({} entries)', jarFile.name, names.size())
        } finally { zip.close() }
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Only Pyro VFX's own source sets belong to this Gradle project.
    // Pyro UI is a separate, independently built NeoForge mod. Mapping its
    // source set here gives ModDevGradle incorrect *root-project* output paths
    // under fml.modFolders (and prevents NeoForge from discovering pyro_ui).
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.development)
        }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // Install the separately built Pyro UI mod into each run's own mods/
        // directory. This also works for visual/network run profiles that
        // use a different gameDirectory. Do not treat it as a root source set.
        configureEach { runModel ->
            def uiModJar = rootProject.project(":pyro-ui").tasks.named("jar").flatMap { it.archiveFile }
            def stageUi = tasks.register("stagePyroUiFor" +
                    runModel.name.substring(0, 1).toUpperCase(java.util.Locale.ROOT) +
                    runModel.name.substring(1), Copy) {
                from uiModJar
                into runModel.gameDirectory.dir("mods")
            }
            taskBefore stageUi
        }
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Interactive museum: open the dedicated save and leave Minecraft
        // running. Unlike clientBench this never auto-exits or records timed
        // benchmarks. Auto-build is scoped to this explicit launch profile.
        clientMuseum {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'Pyro VFX Museum'
            systemProperty 'pyrovfx.museum.autoStart', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Human visual acceptance: leave the client running and place the
        // player in front of the seven new real-backend validation exhibits.
        clientShowcase {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'Pyro VFX Museum'
            systemProperty 'pyrovfx.museum.autoStart', 'true'
            systemProperty 'pyrovfx.museum.runtimeShowcase', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Human acceptance of the integrated Pyro UI: opens the real
        // Minecraft screen in the existing museum world (no HTML mockup).
        clientUiShowcase {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'Pyro VFX Museum',
                    '--width', providers.gradleProperty('uiWidth').orElse('1280').get(),
                    '--height', providers.gradleProperty('uiHeight').orElse('720').get()
            systemProperty 'pyrovfx.ui.showcase', 'true'
            systemProperty 'pyrovfx.ui.capture.tag', providers.gradleProperty('uiCaptureTag').orElse('after-1280').get()
            systemProperty 'pyrovfx.ui.guiScale', providers.gradleProperty('uiGuiScale').orElse('0').get()
            // Opt-in development screenshot matrix, auto-exit for headless acceptance.
            systemProperty 'pyrovfx.ui.capture', providers.gradleProperty('uiCapture').orElse('false').get()
            systemProperty 'pyrovfx.ui.autoExit', providers.gradleProperty('uiAutoExit').orElse('false').get()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Dedicated in-Minecraft typography and sprite quality comparison;
        // no VFX editor needs to be open. Use /pyrovfx typography in normal runs.
        clientUiGallery {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'Pyro VFX Museum',
                    '--width', providers.gradleProperty('uiWidth').orElse('1280').get(),
                    '--height', providers.gradleProperty('uiHeight').orElse('720').get()
            systemProperty 'pyrovfx.ui.gallery', 'true'
            systemProperty 'pyrovfx.ui.gallery.capture',
                    providers.gradleProperty('uiGalleryCapture').orElse('false').get()
            systemProperty 'pyrovfx.ui.gallery.autoExit',
                    providers.gradleProperty('uiGalleryAutoExit').orElse('false').get()
            systemProperty 'pyrovfx.ui.gallery.reload',
                    providers.gradleProperty('uiGalleryReload').orElse('false').get()
            systemProperty 'pyrovfx.ui.gallery.tag',
                    providers.gradleProperty('uiGalleryTag').orElse('font-quality').get()
            systemProperty 'pyrovfx.ui.guiScale', providers.gradleProperty('uiGuiScale').orElse('0').get()
        }

        // Dedicated interactive graphics compatibility gallery.
        clientRenderGallery {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'Pyro VFX Render Lab'
            systemProperty 'pyrovfx.museum.autoStart', 'true'
            systemProperty 'pyrovfx.museum.visualOnly', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Separate temporary visual verification environments for Iris.
        clientVisualIris {
            client()
            gameDirectory = project.file('run-visual-iris')
            programArguments.addAll '--quickPlaySingleplayer', 'Pyro VFX Render Lab',
                    '--username', 'PyroIris', '--width', '1120', '--height', '700'
            systemProperty 'pyrovfx.museum.autoStart', 'true'
            systemProperty 'pyrovfx.museum.visualOnly', 'true'
        }
        clientVisualComplementary {
            client()
            gameDirectory = project.file('run-visual-complementary')
            programArguments.addAll '--quickPlaySingleplayer', 'Pyro VFX Render Lab',
                    '--username', 'PyroComp', '--width', '1120', '--height', '700'
            systemProperty 'pyrovfx.museum.autoStart', 'true'
            systemProperty 'pyrovfx.museum.visualOnly', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Isolated, opt-in real multiplayer acceptance. Two separately launched
        // Minecraft clients connect to a localhost-only development server.
        networkTestServer {
            server()
            gameDirectory = project.file('run-network-test-server')
            programArgument '--nogui'
            systemProperty 'pyrovfx.multiclient.server', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        networkTestClientA {
            client()
            gameDirectory = project.file('run-network-test-client-a')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25575',
                    '--username', 'PyroA', '--width', '960', '--height', '540'
            systemProperty 'pyrovfx.multiclient.client', 'A'
        }
        networkTestClientB {
            client()
            gameDirectory = project.file('run-network-test-client-b')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25575',
                    '--username', 'PyroB', '--width', '960', '--height', '540'
            systemProperty 'pyrovfx.multiclient.client', 'B'
        }

        clientBench {
            client()
            programArguments.addAll '--quickPlaySingleplayer', providers.gradleProperty('benchWorld').orElse('Test VFX').get()
            // Opt-in window geometry; unchanged when benchmarking historical M0-M5 fixtures.
            def benchWidth = providers.gradleProperty('benchWidth')
            def benchHeight = providers.gradleProperty('benchHeight')
            if (benchWidth.isPresent() != benchHeight.isPresent()) {
                throw new GradleException("Set both -PbenchWidth and -PbenchHeight")
            }
            if (benchWidth.isPresent()) {
                programArguments.addAll '--width', benchWidth.get(), '--height', benchHeight.get()
                systemProperty 'pyrovfx.bench.expectedWidth', benchWidth.get()
                systemProperty 'pyrovfx.bench.expectedHeight', benchHeight.get()
            }
            systemProperty 'pyrovfx.bench.uncapped', providers.gradleProperty('benchUncapped').orElse('false').get()
            systemProperty 'pyrovfx.bench.adaptive', providers.gradleProperty('benchAdaptive').orElse('false').get()
            systemProperty 'pyrovfx.bench.adaptiveTargetMs', providers.gradleProperty('benchAdaptiveTargetMs').orElse('0').get()
            systemProperty 'pyrovfx.bench.secondMonitorBackground', providers.gradleProperty('benchSecondMonitorBackground').orElse('false').get()
            systemProperty 'pyrovfx.collision.disableCache', providers.gradleProperty('benchDisableCollisionCache').orElse('false').get()
            systemProperty 'pyrovfx.bench.auto', providers.gradleProperty('benchScenario').orElse('sprite_1k').get()
            systemProperty 'pyrovfx.bench.museumBuild', providers.gradleProperty('benchMuseumBuild').orElse('false').get()
            systemProperty 'pyrovfx.bench.gpuTelemetry', providers.gradleProperty('benchGpuTelemetry').orElse('false').get()
            systemProperty 'pyrovfx.model.forceLegacy', providers.gradleProperty('benchModelForceLegacy').orElse('false').get()
            systemProperty 'pyrovfx.bench.vramProbe', providers.gradleProperty('benchVramProbe').orElse('false').get()
            systemProperty 'pyrovfx.bench.soakTicks', providers.gradleProperty('benchSoakTicks').orElse('600').get()
            systemProperty 'pyrovfx.bench.allowHeavy', providers.gradleProperty('benchHeavy').orElse('false').get()
            systemProperty 'pyrovfx.bench.globalStress', providers.gradleProperty('benchGlobalStress').orElse('false').get()
            systemProperty 'pyrovfx.render.forceLegacy', providers.gradleProperty('benchLegacyRender').orElse('false').get()
            systemProperty 'pyrovfx.render.debugNoCulling', providers.gradleProperty('benchNoCulling').orElse('false').get()
            systemProperty 'pyrovfx.render.tinyAnalyticThreshold', providers.gradleProperty('benchTinyAnalyticThreshold').orElse('12').get()
            systemProperty 'pyrovfx.render.minDiameterPx', providers.gradleProperty('benchMinDiameterPx').orElse('0.20').get()
            systemProperty 'pyrovfx.render.stateAudit', providers.gradleProperty('benchRenderStateAudit').orElse('false').get()
            systemProperty 'pyrovfx.bench.requireGpuInstancing', providers.gradleProperty('benchRequireGpuInstancing').orElse('false').get()
            systemProperty 'pyrovfx.cpu.forceLegacy', providers.gradleProperty('benchLegacyCpu').orElse('false').get()
            systemProperty 'pyrovfx.analytic.forceCpu', providers.gradleProperty('benchLegacyAnalytic').orElse('false').get()
            systemProperty 'pyrovfx.bench.requireGpuAnalytic', providers.gradleProperty('benchRequireGpuAnalytic').orElse('false').get()
            systemProperty 'pyrovfx.bench.autoExit', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // Compile against Pyro UI, but do NOT add its JAR as a second runtime mod:
    // each development run stages it once into mods/. The release still uses
    // the supported NeoForge Jar-in-Jar dependency mechanism.
    compileOnly project(':pyro-ui')
    jarJar project(':pyro-ui')

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
