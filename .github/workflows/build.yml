name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check repository and documentation integrity
        run: python3 tools/check_repo_integrity.py

      - name: Build
        run: ./gradlew build developmentJar verifyReleaseJar --stacktrace

      - name: Run headless Minecraft GameTests
        run: ./gradlew runGameTestServer --no-daemon --console=plain

      - name: Verify archived benchmark integrity
        run: |
          python3 tools/test_compare_bench.py
          python3 tools/verify_m6_collision.py --folder docs/benchmarks/m6-2026-11-02 --after 20261102-024000
          python3 tools/verify_adaptive_bench.py docs/benchmarks/m6-2026-11-02/adaptive_steady-20261102-132543.json docs/benchmarks/m6-2026-11-02/adaptive_steady-20261102-132645.json
          python3 tools/verify_soak_bench.py docs/benchmarks/m6-2026-11-02/soak_mixed-20261102-134026.json docs/benchmarks/m6-2026-11-02/soak_mixed-20261102-134356.json
          python3 tools/verify_universal_short.py
          java tools/CompareScreenshots.java docs/benchmarks/m6-2026-11-02/screenshots/analytic_age_cpu_1280x720.png docs/benchmarks/m6-2026-11-02/screenshots/analytic_age_gpu_1280x720.png 0.03
          java tools/CompareScreenshots.java docs/benchmarks/m6-2026-11-02/universal-short/screenshots/item_legacy.png docs/benchmarks/m6-2026-11-02/universal-short/screenshots/item_gpu.png 0.03

      - name: Upload JARs
        uses: actions/upload-artifact@v5
        with:
          name: pyro-vfx-build
          path: build/libs/*.jar
          if-no-files-found: error
